<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexyora Labs | Article View</title>
    <link rel="icon" type="image/x-icon" href="/techworld.jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles-responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; margin: 0; min-height: 100vh; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="font-sans pb-20">

    <nav class="p-6 flex justify-between items-center max-w-4xl mx-auto">
        <a href="index.html" class="text-2xl font-bold uppercase gradient-text flex items-center gap-2">
            <i class="fa-solid fa-arrow-left text-sm text-sky-400"></i> Nexyora Labs
        </a>
    </nav>

    <main class="max-w-3xl mx-auto px-4 mt-6">
        <div id="postContainer" class="glass rounded-3xl p-6 md:p-10 shadow-2xl">
            <p class="text-slate-400 text-sm">Loading article...</p>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDM4BWnLf6jGycrMdQClWtq-Ra2iDidWsQ",
            authDomain: "tech-world-93ee6.firebaseapp.com",
            databaseURL: "https://tech-world-93ee6-default-rtdb.firebaseio.com",
            projectId: "tech-world-93ee6",
            storageBucket: "tech-world-93ee6.firebasestorage.app",
            appId: "1:912275465700:web:5ec12525e03446712153f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        let currentUser = null;
        let viewIncremented = false;

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (postId) {
                // Increment view count once per page load
                if (!viewIncremented) {
                    incrementViews(postId);
                    viewIncremented = true;
                }
                loadPostDetails(postId);
            } else {
                document.getElementById('postContainer').innerHTML = `<p class="text-red-400">Please log in to read full articles.</p>`;
            }
        });

        // Safe view counter increment using transactions
        function incrementViews(id) {
            const viewsRef = ref(db, `posts/${id}/views`);
            runTransaction(viewsRef, (currentViews) => {
                return (currentViews || 0) + 1;
            });
        }

        // Realtime loader for post content and likes
        function loadPostDetails(id) {
            const postRef = ref(db, `posts/${id}`);
            onValue(postRef, (snapshot) => {
                const post = snapshot.val();
                const container = document.getElementById('postContainer');

                if (!post) {
                    container.innerHTML = `<p class="text-red-400">Article not found.</p>`;
                    return;
                }

                const likeCount = post.likesCount || 0;
                const viewCount = post.views || 0;
                const userHasLiked = currentUser && post.likedBy && post.likedBy[currentUser.uid];

                container.innerHTML = `
                    <h1 class="text-3xl md:text-4xl font-bold mb-4 gradient-text">${post.title || 'Untitled Article'}</h1>
                    
                    <div class="flex items-center gap-6 text-xs text-slate-400 border-b border-white/10 pb-4 mb-6">
                        <span><i class="fa-solid fa-eye text-sky-400 mr-1"></i> ${viewCount} Views</span>
                        <span><i class="fa-solid fa-heart text-red-400 mr-1"></i> <span id="likeCountText">${likeCount}</span> Likes</span>
                    </div>

                    ${post.imageUrl ? `<img src="${post.imageUrl}" class="w-full max-h-96 object-cover rounded-2xl mb-6 border border-white/10" />` : ''}

                    <div class="text-slate-200 leading-relaxed text-base whitespace-pre-line mb-8">
                        ${post.content || ''}
                    </div>

                    <div class="border-t border-white/10 pt-6 flex items-center justify-between">
                        <button id="likeBtn" class="flex items-center gap-2 ${userHasLiked ? 'bg-red-600' : 'bg-slate-800 hover:bg-slate-700'} px-6 py-2.5 rounded-full font-bold text-sm transition">
                            <i class="fa-solid fa-heart ${userHasLiked ? 'text-white' : 'text-red-400'}"></i>
                            <span id="likeBtnText">${userHasLiked ? 'Liked' : 'Like Post'}</span>
                        </button>
                    </div>
                `;

                document.getElementById('likeBtn').onclick = () => toggleLike(id);
            });
        }

        // Toggle like status in Firebase
        function toggleLike(id) {
            if (!currentUser) return alert("Please log in to like posts.");

            const postRef = ref(db, `posts/${id}`);
            runTransaction(postRef, (post) => {
                if (post) {
                    if (!post.likedBy) post.likedBy = {};
                    if (!post.likesCount) post.likesCount = 0;

                    if (post.likedBy[currentUser.uid]) {
                        // Unlike
                        post.likesCount = Math.max(0, post.likesCount - 1);
                        delete post.likedBy[currentUser.uid];
                    } else {
                        // Like
                        post.likesCount = (post.likesCount || 0) + 1;
                        post.likedBy[currentUser.uid] = true;
                    }
                }
                return post;
            });
        }
    </script>
</body>
</html>

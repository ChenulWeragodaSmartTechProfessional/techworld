<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexyora Labs | Article View</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .content-area p { margin-bottom: 1.25rem; line-height: 1.8; color: #cbd5e1; }
        .content-area h1, .content-area h2, .content-area h3 { color: #38bdf8; font-weight: bold; margin-top: 1.5rem; margin-bottom: 1rem; }
        .content-area a { color: #818cf8; text-decoration: underline; word-break: break-all; }
        .content-area ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        .content-area ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; }
    </style>
</head>
<body class="p-4 md:p-8">

    <main class="max-w-3xl mx-auto glass p-6 md:p-12 rounded-3xl shadow-2xl mt-8">
        <a href="/index.html" class="inline-flex items-center text-xs font-bold text-blue-400 hover:underline mb-6">
            <i class="fa-solid fa-arrow-left mr-2"></i> Back to Articles
        </a>

        <div id="postContainer">
            <p class="text-slate-400 italic">Loading article...</p>
        </div>
    </main>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDM4BWnLf6jGycrMdQClWtq-Ra2iDidWsQ",
        authDomain: "tech-world-93ee6.firebaseapp.com",
        databaseURL: "https://tech-world-93ee6-default-rtdb.firebaseio.com",
        projectId: "tech-world-93ee6",
        storageBucket: "tech-world-93ee6.firebasestorage.app",
        appId: "1:912275465700:web:5ec12525e03446712153f1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('id');
    const container = document.getElementById('postContainer');

    if (!postId) {
        container.innerHTML = `<p class="text-red-400 font-bold">Error: No post specified.</p>`;
    } else {
        // Increment total view count dynamically
        const viewsRef = ref(db, `posts/${postId}/views`);
        runTransaction(viewsRef, (currentViews) => {
            return (currentViews || 0) + 1;
        });

        // Load article content
        get(ref(db, 'posts/' + postId)).then((snapshot) => {
            if (snapshot.exists()) {
                const post = snapshot.val();
                const imgHtml = post.imageUrl ? `<img src="${post.imageUrl}" class="w-full h-64 object-cover rounded-2xl mb-8 border border-white/10">` : '';

                container.innerHTML = `
                    ${imgHtml}
                    <h1 class="text-3xl md:text-4xl font-bold text-blue-400 mb-4">${post.title || 'Untitled Article'}</h1>
                    <div class="text-xs text-slate-400 mb-8 border-b border-white/10 pb-4 flex items-center justify-between">
                        <span><i class="fa-solid fa-user text-blue-400 mr-1"></i> ${post.author || 'Admin'}</span>
                        <span><i class="fa-solid fa-eye text-blue-400 mr-1"></i> ${(post.views || 0) + 1} views</span>
                    </div>
                    <div class="content-area text-slate-300">
                        ${post.content || ''}
                    </div>
                `;
            } else {
                container.innerHTML = `<p class="text-red-400 font-bold">Article not found in database.</p>`;
            }
        }).catch((error) => {
            container.innerHTML = `<p class="text-red-400">Error loading article: ${error.message}</p>`;
        });
    }
</script>
</body>
</html>

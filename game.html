<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech World | Data Link Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Game Card Styles */
        .card { height: 100px; cursor: pointer; perspective: 1000px; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 2rem; }
        .card-front { background: #1e293b; border: 1px solid #334155; }
        .card-back { background: #3b82f6; transform: rotateY(180deg); color: white; }
        .matched .card-back { background: #10b981; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-md mx-auto text-center">
        <h1 class="text-3xl font-bold mb-2 gradient-text">DATA LINK</h1>
        <p class="text-gray-400 text-sm mb-6">Match the tech icons to restore the submarine cable link!</p>
        
       <div id="game-stats" class="flex justify-between mb-4 px-4 font-mono text-sm">
    <span class="text-blue-400">Level: <span id="level">1</span></span>
    <span class="text-red-400">Time: <span id="timer">30</span>s</span>
    <span class="text-blue-400">Moves: <span id="moves">0</span></span>
</div>

        <div id="grid" class="grid grid-cols-4 gap-3 mb-8">
            </div>

        <button onclick="resetGame()" class="bg-blue-600 hover:bg-blue-500 px-8 py-3 rounded-xl font-bold transition w-full shadow-lg">
            Restart System
        </button>
    </div>

   <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDM4BWnLf6jGycrMdQClWtq-Ra2iDidWsQ",
        authDomain: "tech-world-93ee6.firebaseapp.com",
        databaseURL: "https://tech-world-93ee6-default-rtdb.firebaseio.com",
        projectId: "tech-world-93ee6",
        storageBucket: "tech-world-93ee6.firebasestorage.app",
        appId: "1:912275465700:web:5ec12525e03446712153f1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;
    let currentLevel = 1;
    let timeLeft = 30;
    let timerInterval;
    let flippedCards = [];
    let matchedCount = 0;
    let moves = 0;

    const allIcons = ['fa-microchip', 'fa-code', 'fa-database', 'fa-wifi', 'fa-satellite', 'fa-shield-halved', 'fa-server', 'fa-bolt', 'fa-robot', 'fa-laptop-code'];

    onAuthStateChanged(auth, (user) => {
        if (user) { currentUser = user; }
    });

    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert("⏳ TIME OUT! Game Over. Try again!");
                resetGame(true); // Restart same level
            }
        }, 1000);
    }

    async function addWinPoints() {
        if (!currentUser) return;
        const userRef = ref(db, 'users/' + currentUser.uid);
        const snap = await get(userRef);
        if (snap.exists()) {
            const newTotal = (snap.val().points || 0) + (currentLevel * 5); // Level 1=5pts, Level 2=10pts...
            await update(userRef, { points: newTotal });
        }
    }

    window.flipCard = (card, icon) => {
        if (flippedCards.length < 2 && !card.classList.contains('flipped')) {
            card.classList.add('flipped');
            flippedCards.push({ card, icon });
            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').textContent = moves;
                checkMatch();
            }
        }
    };

    function checkMatch() {
        const [c1, c2] = flippedCards;
        if (c1.icon === c2.icon) {
            c1.card.classList.add('matched');
            c2.card.classList.add('matched');
            matchedCount += 2;
            flippedCards = [];
            
            const totalCardsForLevel = (currentLevel + 1) * 2; 
            if (matchedCount >= (currentLevel === 1 ? 4 : currentLevel === 2 ? 8 : 16)) {
                clearInterval(timerInterval);
                addWinPoints();
                
                if (currentLevel < 3) {
                    alert(`Level ${currentLevel} Cleared! Get ready for Level ${currentLevel + 1}`);
                    currentLevel++;
                    resetGame(false);
                } else {
                    alert("🏆 ULTIMATE CHAMPION! You cleared all levels.");
                    currentLevel = 1;
                    resetGame(false);
                }
            }
        } else {
            setTimeout(() => {
                c1.card.classList.remove('flipped');
                c2.card.classList.remove('flipped');
                flippedCards = [];
            }, 800);
        }
    }

    window.resetGame = (isRetry) => {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        matchedCount = 0;
        moves = 0;
        flippedCards = [];
        
        // Difficulty scaling
        let cardCount = 4; // Level 1
        if (currentLevel === 2) cardCount = 8;
        if (currentLevel === 3) cardCount = 16;
        
        timeLeft = currentLevel === 1 ? 20 : currentLevel === 2 ? 40 : 60;
        
        document.getElementById('level').textContent = currentLevel;
        document.getElementById('moves').textContent = '0';
        document.getElementById('timer').textContent = timeLeft;

        // Set Grid Columns
        grid.className = `grid gap-3 mb-8 ${currentLevel === 3 ? 'grid-cols-4' : 'grid-cols-2'}`;

        const levelIcons = allIcons.slice(0, cardCount / 2);
        const gameCards = [...levelIcons, ...levelIcons].sort(() => Math.random() - 0.5);

        gameCards.forEach((icon) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.style.height = currentLevel === 3 ? '80px' : '120px'; // Shrink cards for Level 3
            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-front"><i class="fa-solid fa-microchip opacity-20"></i></div>
                    <div class="card-back"><i class="fa-solid ${icon}"></i></div>
                </div>`;
            card.onclick = () => window.flipCard(card, icon);
            grid.appendChild(card);
        });

        startTimer();
    };

    window.resetGame(false);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexyora Labs | Horror & Psychology Stories</title>
    <link rel="icon" type="image/x-icon" href="/techworld.jpeg">
    <link rel="stylesheet" href="styles-responsive.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #080c14; color: #f8fafc; margin: 0; min-height: 100vh; }
        .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .gradient-text { background: linear-gradient(90deg, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .story-card:hover { transform: translateY(-4px); border-color: rgba(168, 85, 247, 0.4); }
    </style>
</head>
<body class="font-sans p-4 md:p-8 max-w-6xl mx-auto">

    <header class="flex justify-between items-center mb-10 pb-4 border-b border-white/10">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-ghost text-2xl text-purple-500"></i>
            <div>
                <h1 class="text-xl font-extrabold uppercase tracking-wider gradient-text">Shadow Archives</h1>
                <p class="text-xs text-slate-400">Horror & Psychological Tales</p>
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            <a href="index.html" class="text-xs text-slate-400 hover:text-purple-400 transition font-bold">
                <i class="fa-solid fa-house mr-1"></i> Tech Blog
            </a>
            <a href="admin.html" class="text-xs bg-purple-600/20 text-purple-300 hover:bg-purple-600 hover:text-white px-3 py-1.5 rounded-xl border border-purple-500/30 font-bold transition">
                <i class="fa-solid fa-pen mr-1"></i> Admin Portal
            </a>
        </div>
    </header>

    <section class="glass p-8 rounded-3xl mb-10 text-center relative overflow-hidden">
        <div class="absolute -right-10 -bottom-10 w-48 h-48 bg-purple-600/10 rounded-full blur-3xl"></div>
        <h2 class="text-2xl md:text-3xl font-extrabold mb-2 text-purple-200">Step Into The Dark</h2>
        <p class="text-xs md:text-sm text-slate-400 max-w-xl mx-auto">Explore mind-bending psychological thrillers, dark mysteries, and eerie horror stories.</p>
    </section>

    <main>
        <div id="storiesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div id="loadingState" class="col-span-full text-center py-16 text-slate-500 text-sm italic">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-purple-500 mb-3 block"></i>
                Summoning stories from Firebase...
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDM4BWnLf6jGycrMdQClWtq-Ra2iDidWsQ",
            authDomain: "tech-world-93ee6.firebaseapp.com",
            databaseURL: "https://tech-world-93ee6-default-rtdb.firebaseio.com",
            projectId: "tech-world-93ee6",
            storageBucket: "tech-world-93ee6.firebasestorage.app",
            appId: "1:912275465700:web:5ec12525e03446712153f1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Fetch stories live from Firebase
        onValue(ref(db, 'posts'), (snapshot) => {
            const container = document.getElementById('storiesContainer');
            container.innerHTML = "";
            const posts = snapshot.val() || {};

            const keys = Object.keys(posts).reverse();

            if (keys.length > 0) {
                keys.forEach(key => {
                    const post = posts[key];

                    // Unescape preview text
                    let rawText = (post.content || "")
                        .replace(/&lt;/g, "<")
                        .replace(/&gt;/g, ">")
                        .replace(/&quot;/g, '"')
                        .replace(/&#039;/g, "'")
                        .replace(/&amp;/g, "&");

                    // Create short preview excerpt
                    const excerpt = rawText.replace(/<[^>]*>?/gm, '').substring(0, 120) + "...";

                    const card = document.createElement('div');
                    card.className = "glass rounded-2xl p-5 transition-all duration-300 story-card flex flex-col justify-between";

                    card.innerHTML = `
                        <div>
                            ${post.imageUrl ? `
                                <div class="h-44 rounded-xl overflow-hidden mb-4 border border-white/5">
                                    <img src="${post.imageUrl}" class="w-full h-full object-cover" alt="Story Cover">
                                </div>
                            ` : ''}
                            <h3 class="font-bold text-lg text-slate-100 mb-2 hover:text-purple-400 transition">
                                <a href="story.html?id=${key}">${post.title || 'Untitled Tale'}</a>
                            </h3>
                            <p class="text-xs text-slate-400 leading-relaxed mb-4">${excerpt}</p>
                        </div>
                        
                        <div class="pt-4 border-t border-slate-800 flex justify-between items-center text-xs text-slate-500">
                            <span class="flex items-center gap-3">
                                <span><i class="fa-solid fa-eye text-purple-400/70 mr-1"></i> ${post.views || 0}</span>
                                <span><i class="fa-solid fa-heart text-pink-500/70 mr-1"></i> ${post.likesCount || 0}</span>
                            </span>
                            <a href="story.html?id=${key}" class="text-purple-400 font-bold hover:underline flex items-center gap-1">
                                Read Story <i class="fa-solid fa-arrow-right text-[10px]"></i>
                            </a>
                        </div>
                    `;

                    container.appendChild(card);
                });
            } else {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-500 text-sm">
                        No horror or psychology stories published yet.
                    </div>
                `;
            }
        });
    </script>
</body>
</html>

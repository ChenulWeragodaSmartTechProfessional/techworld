<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Tech World</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="p-4">
    <div class="max-w-md w-full glass rounded-3xl p-8 shadow-2xl">
        <a href="index.html" class="text-slate-400 text-sm mb-6 inline-block">← Back</a>
        <h2 id="displayUser" class="text-2xl font-bold">Loading...</h2>
        <p id="displayEmail" class="text-slate-400 mb-6">...</p>
        <button onclick="signOutUser()" class="w-full py-3 rounded-xl bg-red-600/20 text-red-400 font-bold">LOGOUT</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDM4BWnLf6jGycrMdQClWtq-Ra2iDidWsQ",
            authDomain: "tech-world-93ee6.firebaseapp.com",
            projectId: "tech-world-93ee6",
            appId: "1:912275465700:web:5ec12525e03446712153f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('displayUser').textContent = user.displayName || user.email.split('@')[0];
                document.getElementById('displayEmail').textContent = user.email;
            } else { window.location.href = "index.html"; }
        });
        window.signOutUser = () => signOut(auth).then(() => window.location.href = "index.html");
    </script>
</body>
</html>

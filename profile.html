<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile | Tech World</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .loader { border-top-color: #3b82f6; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', ' G-S157MJXH6K');
</script>
<body class="font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div id="loading" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center">
        <div class="loader w-12 h-12 border-4 border-blue-900 rounded-full"></div>
    </div>

    <div class="max-w-md w-full glass rounded-3xl p-8 shadow-2xl relative">
        <a href="index.html" class="text-slate-400 hover:text-white transition text-sm mb-6 inline-block">
            <i class="fa-solid fa-arrow-left"></i> Back to Feed
        </a>

        <div class="text-center mb-8">
            <div class="w-24 h-24 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-full mx-auto flex items-center justify-center text-3xl font-black shadow-lg mb-4">
                <span id="initials">--</span>
            </div>
            <h2 class="text-2xl font-bold gradient-text" id="displayUser">Loading...</h2>
            <p class="text-slate-400 text-sm" id="displayEmail">---</p>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-slate-800/50 p-4 rounded-2xl border border-white/5 text-center">
                <p class="text-xs text-slate-500 uppercase font-bold tracking-wider mb-1">Points</p>
                <p class="text-2xl font-black text-yellow-500" id="userPoints">0</p>
            </div>
            <div class="bg-slate-800/50 p-4 rounded-2xl border border-white/5 text-center">
                <p class="text-xs text-slate-500 uppercase font-bold tracking-wider mb-1">Status</p>
                <p class="text-sm font-bold text-green-400" id="userStatus">Active Now</p>
            </div>
        </div>

        <div class="space-y-6">
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase ml-1">Display Name</label>
                <div class="flex gap-2 mt-2">
                    <input type="text" id="newName" placeholder="Enter new name" class="flex-1 bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 text-sm">
                    <button id="updateNameBtn" class="bg-blue-600 hover:bg-blue-500 px-4 rounded-xl transition">
                        <i class="fa-solid fa-check"></i>
                    </button>
                </div>
            </div>

            <div class="pt-4 border-t border-slate-800">
                <p class="text-xs text-slate-500">
                    <i class="fa-solid fa-clock mr-1"></i> Last Daily Reward: 
                    <span id="lastLoginDate" class="text-slate-300 font-medium">---</span>
                </p>
            </div>

            <button onclick="signOutUser()" class="w-full py-3 rounded-xl border border-red-500/30 text-red-400 hover:bg-red-500/10 font-bold transition text-sm">
                LOGOUT ACCOUNT
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDM4BWnLf6jGycrMdQClWtq-Ra2iDidWsQ",
            authDomain: "tech-world-93ee6.firebaseapp.com",
            databaseURL: "https://tech-world-93ee6-default-rtdb.firebaseio.com",
            projectId: "tech-world-93ee6",
            storageBucket: "tech-world-93ee6.firebasestorage.app",
            appId: "1:912275465700:web:5ec12525e03446712153f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('displayEmail').textContent = user.email;
                document.getElementById('loading').style.display = 'none';
                
                // Fetch Data from Realtime Database
                const userRef = ref(db, 'users/' + user.uid);
                onValue(userRef, (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const name = data.displayName || user.displayName || user.email.split('@')[0];
                        document.getElementById('displayUser').textContent = name;
                        document.getElementById('userPoints').textContent = data.points || 0;
                        document.getElementById('lastLoginDate').textContent = data.lastLogin || "Never";
                        document.getElementById('initials').textContent = name.substring(0, 2).toUpperCase();
                    }
                });
            } else {
                window.location.href = "index.html"; // Redirect if not logged in
            }
        });

        // Update Name Logic
        document.getElementById('updateNameBtn').onclick = async () => {
            const user = auth.currentUser;
            const newName = document.getElementById('newName').value.trim();
            
            if (newName.length > 2 && newName.length < 20) {
                try {
                    // Update Auth Profile
                    await updateProfile(user, { displayName: newName });
                    // Update Database
                    await update(ref(db, 'users/' + user.uid), { displayName: newName });
                    alert("Profile Updated!");
                    document.getElementById('newName').value = "";
                } catch (e) { alert(e.message); }
            } else {
                alert("Name must be between 3-20 characters.");
            }
        };

        window.signOutUser = () => signOut(auth).then(() => window.location.href = "index.html");
    </script>
</body>
</html>

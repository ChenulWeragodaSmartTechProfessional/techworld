<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexyora Labs | Official Store</title>
    <link rel="stylesheet" href="styles-responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/x-icon" href="/techworld.jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body { background-color: #0f172a; color: #f8fafc; overflow-x: hidden; margin: 0; }
        #particles-js { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: 0; pointer-events: none; }
        nav, main { position: relative; z-index: 10; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .product-card { 
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 1.25rem; 
            overflow: hidden;
            transition: all 0.3s ease; 
        }
        .product-card:hover { 
            transform: translateY(-6px); 
            border-color: rgba(56, 189, 248, 0.5); 
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.1);
        }
        
        .wa-btn { 
            background-color: #25D366; 
            color: #ffffff; 
            font-weight: bold; 
            width: 100%; 
            padding: 0.75rem; 
            border-radius: 0.75rem; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 0.5rem; 
            transition: background-color 0.2s ease; 
        }
        .wa-btn:hover { background-color: #1da851; }
    </style>
</head>
<body class="font-sans">

    <div id="particles-js"></div>

    <nav class="p-6 flex justify-between items-center max-w-6xl mx-auto relative z-10">
        <a href="/index.html" class="text-2xl font-bold uppercase gradient-text flex items-center gap-2">
            Nexyora Labs
        </a>
        <div class="flex items-center gap-4">
            <a href="/index.html" class="bg-slate-800/80 border border-white/10 px-4 py-2 rounded-full hover:bg-slate-700 text-sm font-semibold transition flex items-center gap-2">
                <i class="fa-solid fa-house text-blue-400"></i> Home Portal
            </a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 pb-20 mt-6">
        
        <div class="glass rounded-3xl p-8 mb-8 text-center shadow-2xl">
            <h1 class="text-3xl md:text-4xl font-extrabold mb-3">Official Store</h1>
            <p class="text-slate-400 max-w-xl mx-auto text-sm md:text-base">
                Explore our official offerings. Tap any product to open a direct WhatsApp chat to place your order or ask questions!
            </p>
        </div>

        <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div id="loadingState" class="col-span-full text-center py-16 text-slate-500 text-sm italic">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-blue-400 mb-3 block"></i>
                Loading products...
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDM4BWnLf6jGycrMdQClWtq-Ra2iDidWsQ",
            authDomain: "tech-world-93ee6.firebaseapp.com",
            databaseURL: "https://tech-world-93ee6-default-rtdb.firebaseio.com",
            projectId: "tech-world-93ee6",
            storageBucket: "tech-world-93ee6.firebasestorage.app",
            appId: "1:912275465700:web:5ec12525e03446712153f1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const defaultPhone = "94721502524";

        function escapeHTML(str) {
            return (str || '').replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        }

        window.buyOnWhatsApp = function(productName, price, whatsappNum) {
            const phone = whatsappNum || defaultPhone;
            const message = `Hello Nexyora Labs! 👋\n\nI am interested in buying:\n📦 *Item:* ${productName}\n💵 *Price:* ${price}\n\nPlease let me know availability and payment methods!`;
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        };

        const categoryStyles = {
            'HARDWARE': 'bg-blue-500/20 text-blue-400',
            'SOFTWARE / AI': 'bg-indigo-500/20 text-indigo-400',
            'SERVICE': 'bg-purple-500/20 text-purple-400'
        };

        onValue(ref(db, 'store'), (snapshot) => {
            const container = document.getElementById('productsGrid');
            container.innerHTML = "";
            const items = snapshot.val() || {};
            const keys = Object.keys(items).reverse();

            if (keys.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-500 text-sm">
                        No products available in the store at the moment.
                    </div>
                `;
                return;
            }

            keys.forEach(key => {
                const item = items[key];
                const categoryClass = categoryStyles[item.category] || 'bg-blue-500/20 text-blue-400';
                
                const card = document.createElement('div');
                card.className = "product-card p-5 flex flex-col justify-between";

                const safeTitle = escapeHTML(item.title || 'Untitled Item');
                const safePrice = escapeHTML(item.price || 'RS.00.00');
                const safeWhatsApp = escapeHTML(item.whatsapp || defaultPhone);

                card.innerHTML = `
                    <div>
                        <img src="${escapeHTML(item.imageUrl || '/techworld.jpeg')}" alt="${safeTitle}" class="w-full h-48 object-cover rounded-xl mb-4 border border-white/5">
                        <span class="text-[10px] uppercase font-bold tracking-wider px-3 py-1 rounded-full ${categoryClass}">
                            ${escapeHTML(item.category || 'HARDWARE')}
                        </span>
                        <h3 class="font-bold text-white text-xl mt-2">${safeTitle}</h3>
                        <p class="text-xs text-slate-400 mt-2 mb-4 leading-relaxed">${escapeHTML(item.description || 'No Description')}</p>
                    </div>
                    <div>
                        <div class="text-2xl font-extrabold text-blue-400 mb-4">${safePrice}</div>
                        <button onclick="buyOnWhatsApp('${safeTitle.replace(/'/g, "\\'")}', '${safePrice.replace(/'/g, "\\'")}', '${safeWhatsApp}')" class="wa-btn">
                            <i class="fa-brands fa-whatsapp text-xl"></i> Order via WhatsApp
                        </button>
                    </div>
                `;

                container.appendChild(card);
            });
        });

        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 70 },
                "color": { "value": "#38bdf8" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5 },
                "size": { "value": 3 },
                "line_linked": { "enable": true, "distance": 150, "color": "#38bdf8", "opacity": 0.4, "width": 1 },
                "move": { "enable": true, "speed": 2 }
            },
            "interactivity": {
                "events": { "onhover": { "enable": true, "mode": "repulse" } }
            },
            "retina_detect": true
        });
    </script>
</body>
</html>

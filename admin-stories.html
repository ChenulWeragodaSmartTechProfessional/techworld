<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexyora Labs | Story Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #080c14; color: #f8fafc; margin: 0; min-height: 100vh; }
        .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .auth-hidden { display: none !important; }
        .gradient-text { background: linear-gradient(90deg, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="font-sans p-4 md:p-8 max-w-4xl mx-auto">

    <header class="flex justify-between items-center mb-10 pb-4 border-b border-white/10">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-pen-nib text-2xl text-purple-500"></i>
            <div>
                <h1 class="text-xl font-extrabold uppercase tracking-wider gradient-text">Story Admin Portal</h1>
                <p class="text-xs text-slate-400">Manage Shadow Archives Content</p>
            </div>
        </div>
        
        <div id="userHeader" class="auth-hidden flex items-center gap-4">
            <a href="stories.html" class="text-xs text-slate-400 hover:text-purple-400 transition font-bold">
                <i class="fa-solid fa-book-open mr-1"></i> View Stories Site
            </a>
            <button onclick="signOutUser()" class="text-red-400 text-xs font-bold uppercase hover:underline">Logout</button>
        </div>
    </header>

    <section id="authSection" class="max-w-md mx-auto mt-8">
        <div class="glass p-8 rounded-3xl shadow-2xl text-center">
            <h2 class="text-2xl font-bold mb-6 text-purple-300">Story Admin Login</h2>
            <div class="space-y-3">
                <input type="email" id="email" placeholder="Email" class="w-full bg-slate-900/60 border border-slate-700/60 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500">
                <input type="password" id="password" placeholder="Password" class="w-full bg-slate-900/60 border border-slate-700/60 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500">
                <button id="authBtn" class="w-full bg-purple-600 hover:bg-purple-500 py-3 rounded-xl font-bold transition">Sign In / Sign Up</button>
                
                <div class="flex items-center my-4">
                    <div class="flex-1 border-t border-slate-700"></div>
                    <span class="px-3 text-slate-500 text-xs uppercase">Or</span>
                    <div class="flex-1 border-t border-slate-700"></div>
                </div>
                
                <button id="googleBtn" class="w-full bg-white text-slate-900 hover:bg-slate-100 py-3 rounded-xl font-bold transition flex items-center justify-center gap-2">
                    <i class="fa-brands fa-google text-red-500"></i> Continue with Google
                </button>
            </div>
            <p class="mt-4 text-[10px] text-slate-500 italic">Verify your email to access story management.</p>
        </div>
    </section>

    <main id="mainContent" class="auth-hidden">
        
        <section class="glass rounded-3xl p-6 md:p-8 shadow-2xl mb-10">
            <h2 class="text-xl font-bold text-purple-300 mb-6 flex items-center gap-2">
                <i class="fa-solid fa-plus-circle"></i> Publish New Horror / Psychology Story
            </h2>

            <form id="storyForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Story Title</label>
                    <input type="text" id="storyTitle" placeholder="e.g., The Echoes of Mind" required class="w-full bg-slate-900/60 border border-slate-700/60 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-purple-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Cover Image URL (Optional)</label>
                    <input type="url" id="storyImage" placeholder="https://example.com/cover.jpg" class="w-full bg-slate-900/60 border border-slate-700/60 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-purple-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Story Content (Supports Markdown / Formatting)</label>
                    <textarea id="storyContent" rows="10" placeholder="Write your dark narrative here..." required class="w-full bg-slate-900/60 border border-slate-700/60 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-purple-500 text-sm leading-relaxed"></textarea>
                </div>

                <button type="submit" id="publishBtn" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 py-3.5 rounded-xl font-bold text-sm transition shadow-lg shadow-purple-600/20">
                    <i class="fa-solid fa-paper-plane mr-2"></i> Publish Story
                </button>
            </form>
        </section>

        <section class="glass rounded-3xl p-6 md:p-8 shadow-2xl">
            <h3 class="text-lg font-bold text-slate-200 mb-6"><i class="fa-solid fa-list-check mr-2"></i> Published Stories</h3>
            <div id="adminStoriesList" class="space-y-4">
                <p class="text-xs text-slate-500 italic">Loading existing stories...</p>
            </div>
        </section>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendEmailVerification, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDM4BWnLf6jGycrMdQClWtq-Ra2iDidWsQ",
            authDomain: "tech-world-93ee6.firebaseapp.com",
            databaseURL: "https://tech-world-93ee6-default-rtdb.firebaseio.com",
            projectId: "tech-world-93ee6",
            storageBucket: "tech-world-93ee6.firebasestorage.app",
            appId: "1:912275465700:web:5ec12525e03446712153f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const googleProvider = new GoogleAuthProvider();

        const storiesRef = ref(db, 'stories');

        // Google Sign-In
        document.getElementById('googleBtn').onclick = async () => {
            try { 
                await signInWithPopup(auth, googleProvider); 
            } catch (err) { 
                alert("Story Portal: " + err.message); 
            }
        };

        // Email / Password Auth with Verification Email Check
        document.getElementById('authBtn').onclick = async () => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value.trim();
            if(!email || !pass) return alert("Story Portal: Enter credentials.");

            try {
                const res = await signInWithEmailAndPassword(auth, email, pass);
                if (!res.user.emailVerified) {
                    alert("Story Portal: Please verify your email first! Check your inbox/spam folder.");
                    await signOut(auth);
                }
            } catch (error) {
                if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                    try {
                        const newUser = await createUserWithEmailAndPassword(auth, email, pass);
                        await sendEmailVerification(newUser.user);
                        alert("Story Portal: Verification email sent! Please check your inbox and confirm your account before logging in.");
                        await signOut(auth);
                    } catch (regErr) { 
                        alert("Story Portal: " + regErr.message); 
                    }
                } else { 
                    alert("Story Portal: " + error.message); 
                }
            }
        };

        window.signOutUser = () => signOut(auth);

        // Auth State Listener (Controls page visibility)
        onAuthStateChanged(auth, (user) => {
            const isVerified = user && (user.emailVerified || user.providerData.some(p => p.providerId === 'google.com'));
            
            document.getElementById('authSection').classList.toggle('auth-hidden', isVerified);
            document.getElementById('mainContent').classList.toggle('auth-hidden', !isVerified);
            document.getElementById('userHeader').classList.toggle('auth-hidden', !isVerified);

            if (isVerified) {
                loadAdminStories();
            }
        });

        // Publish new story
        document.getElementById('storyForm').onsubmit = async (e) => {
            e.preventDefault();
            const title = document.getElementById('storyTitle').value.trim();
            const imageUrl = document.getElementById('storyImage').value.trim();
            const content = document.getElementById('storyContent').value.trim();

            if (!title || !content) return alert("Please fill in required fields.");

            try {
                await push(storiesRef, {
                    title: title,
                    imageUrl: imageUrl || "",
                    content: content,
                    views: 0,
                    likesCount: 0,
                    timestamp: serverTimestamp()
                });
                alert("Story published successfully!");
                document.getElementById('storyForm').reset();
            } catch (err) {
                alert("Error publishing story: " + err.message);
            }
        };

        // Realtime listener for managing published stories
        function loadAdminStories() {
            onValue(storiesRef, (snapshot) => {
                const container = document.getElementById('adminStoriesList');
                container.innerHTML = "";
                const data = snapshot.val();

                if (data && Object.keys(data).length > 0) {
                    Object.keys(data).reverse().forEach(key => {
                        const story = data[key];
                        const item = document.createElement('div');
                        item.className = "flex justify-between items-center bg-slate-900/50 p-4 rounded-xl border border-white/5";
                        
                        item.innerHTML = `
                            <div>
                                <h4 class="font-bold text-sm text-purple-300">${story.title || 'Untitled'}</h4>
                                <p class="text-xs text-slate-500 mt-0.5">Views: ${story.views || 0} | Likes: ${story.likesCount || 0}</p>
                            </div>
                            <button onclick="deleteStory('${key}')" class="bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white px-3 py-1.5 rounded-lg border border-red-500/20 text-xs font-bold transition">
                                <i class="fa-solid fa-trash mr-1"></i> Delete
                            </button>
                        `;
                        container.appendChild(item);
                    });
                } else {
                    container.innerHTML = `<p class="text-xs text-slate-500 italic">No stories published yet.</p>`;
                }
            });
        }

        // Delete story function
        window.deleteStory = async (key) => {
            if (confirm("Are you sure you want to delete this story?")) {
                await remove(ref(db, `stories/${key}`));
            }
        };
    </script>
</body>
</html>

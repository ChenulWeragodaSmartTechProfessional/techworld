<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexyora Labs | Secure Admin Portal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hidden-panel { display: none !important; }
        
        /* Quill Customization for Dark Theme */
        .ql-toolbar { background: #1e293b; border-color: #334155 !important; border-radius: 0.75rem 0.75rem 0 0; }
        .ql-container { background: #0f172a; border-color: #334155 !important; color: #f8fafc; border-radius: 0 0 0.75rem 0.75rem; min-height: 250px; font-size: 1rem; }
        .ql-stroke { stroke: #cbd5e1 !important; }
        .ql-fill { fill: #cbd5e1 !important; }
        .ql-picker { color: #cbd5e1 !important; }
    </style>
</head>
<body class="p-4 md:p-8">

    <section id="adminLoginSection" class="max-w-md mx-auto mt-20">
        <div class="glass p-8 rounded-3xl shadow-2xl text-center">
            <div class="w-16 h-16 bg-blue-600/20 text-blue-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2">Admin Portal Login</h2>
            <p class="text-xs text-slate-400 mb-6">Sign in with your authorized admin email address.</p>
            
            <div class="space-y-4">
                <input type="email" id="adminEmail" placeholder="Admin Email" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
                <input type="password" id="adminPass" placeholder="Password" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
                <button id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold transition shadow-lg">Authenticate</button>
            </div>
            
            <a href="/index.html" class="inline-block mt-6 text-xs text-slate-400 hover:text-white transition">← Return to Main Site</a>
        </div>
    </section>

    <main id="adminDashboard" class="max-w-4xl mx-auto glass p-6 md:p-10 rounded-3xl shadow-2xl hidden-panel">
        <div class="flex justify-between items-center mb-8 pb-4 border-b border-white/10">
            <div>
                <h1 class="text-2xl font-bold text-blue-400">Website Content Manager</h1>
                <p class="text-xs text-slate-400">Authenticated as: <span id="adminEmailDisplay" class="text-blue-300 font-bold"></span></p>
            </div>
            <div class="flex items-center gap-3">
                <a href="/index.html" class="text-xs bg-slate-800 border border-white/10 px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-700 transition">View Website</a>
                <button id="logoutBtn" class="text-xs bg-red-600/20 text-red-400 border border-red-500/20 px-3 py-2 rounded-lg font-bold hover:bg-red-600 hover:text-white transition">Logout</button>
            </div>
        </div>

        <div class="space-y-6">
            <div>
                <label class="block text-sm font-semibold mb-2 text-slate-300">Post Title</label>
                <input type="text" id="postTitle" placeholder="Enter post headline..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 font-semibold">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2 text-slate-300">Post Content & Text Formatting</label>
                <div id="editor"></div>
            </div>

            <button id="publishBtn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:opacity-90 py-4 rounded-xl font-bold text-white shadow-xl transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> Publish Live Post
            </button>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDM4BWnLf6jGycrMdQClWtq-Ra2iDidWsQ",
            authDomain: "tech-world-93ee6.firebaseapp.com",
            databaseURL: "https://tech-world-93ee6-default-rtdb.firebaseio.com",
            projectId: "tech-world-93ee6",
            storageBucket: "tech-world-93ee6.firebasestorage.app",
            appId: "1:912275465700:web:5ec12525e03446712153f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // 🛡️ RECLAMATION: Change this to your exact email address
        const ADMIN_EMAIL = "ideas.by.chen@gmail.com"; 

        // Initialize Rich Text Editor with Color controls
        const quill = new Quill('#editor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'color': [] }, { 'background': [] }], // Font & Highlight Color Selectors
                    [{ 'align': [] }],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['link', 'clean']
                ]
            }
        });

        // Check auth status safely via Firebase
        onAuthStateChanged(auth, (user) => {
            if (user && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                document.getElementById('adminLoginSection').classList.add('hidden-panel');
                document.getElementById('adminDashboard').classList.remove('hidden-panel');
                document.getElementById('adminEmailDisplay').textContent = user.email;
            } else if (user) {
                alert("Unauthorized Access: This account is not an admin.");
                signOut(auth);
            } else {
                document.getElementById('adminLoginSection').classList.remove('hidden-panel');
                document.getElementById('adminDashboard').classList.add('hidden-panel');
            }
        });

        // Secure Login Event
        document.getElementById('loginBtn').onclick = async () => {
            const email = document.getElementById('adminEmail').value.trim();
            const pass = document.getElementById('adminPass').value.trim();

            if (!email || !pass) return alert("Please fill in both Email and Password.");

            if (email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
                return alert("Access Denied: Email address is not authorized for Admin access.");
            }

            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (err) {
                alert("Authentication Failed: " + err.message);
            }
        };

        // Logout Event
        document.getElementById('logoutBtn').onclick = () => signOut(auth);

        // Publish Post Handler
        document.getElementById('publishBtn').onclick = async () => {
            const title = document.getElementById('postTitle').value.trim();
            const contentHtml = quill.root.innerHTML;

            if (!title || quill.getText().trim().length === 0) {
                return alert("Please enter a title and post content.");
            }

            try {
                await push(ref(db, 'posts'), {
                    title: title,
                    content: contentHtml,
                    author: auth.currentUser.email,
                    timestamp: serverTimestamp()
                });

                alert("🎉 Post successfully published live!");
                document.getElementById('postTitle').value = "";
                quill.setText("");
            } catch (err) {
                alert("Error publishing post: " + err.message);
            }
        };
    </script>
</body>
</html>

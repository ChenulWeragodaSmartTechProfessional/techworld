<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexyora Labs | Admin Portal</title>
    <link rel="icon" type="image/x-icon" href="/techworld.jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; margin: 0; min-height: 100vh; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="font-sans p-6 max-w-5xl mx-auto">

    <div class="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
        <h1 class="text-2xl font-bold uppercase gradient-text">Admin Portal</h1>
        <a href="index.html" class="text-xs text-sky-400 font-bold hover:underline"><i class="fa-solid fa-house mr-1"></i> Return Home</a>
    </div>

    <section class="glass p-6 rounded-3xl mb-12">
        <h2 class="text-lg font-bold mb-4 text-blue-400"><i class="fa-solid fa-plus mr-2"></i> Create New Article</h2>
        <div class="space-y-4">
            <input type="text" id="postTitle" placeholder="Article Title" class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
            <input type="text" id="postImg" placeholder="Image URL (Optional)" class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
            <textarea id="postContent" rows="5" placeholder="Article Content..." class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500"></textarea>
            <button id="publishBtn" class="bg-blue-600 hover:bg-blue-500 font-bold px-6 py-3 rounded-xl text-sm transition">Publish Article</button>
        </div>
    </section>

    <section class="glass p-6 rounded-3xl">
        <h2 class="text-lg font-bold mb-6 text-sky-400"><i class="fa-solid fa-list mr-2"></i> Published Articles Analytics</h2>
        <div id="adminPostsList" class="space-y-4">
            <p class="text-xs text-slate-500 italic">Loading statistics...</p>
        </div>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDM4BWnLf6jGycrMdQClWtq-Ra2iDidWsQ",
            authDomain: "tech-world-93ee6.firebaseapp.com",
            databaseURL: "https://tech-world-93ee6-default-rtdb.firebaseio.com",
            projectId: "tech-world-93ee6",
            storageBucket: "tech-world-93ee6.firebasestorage.app",
            appId: "1:912275465700:web:5ec12525e03446712153f1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Publish new post
        document.getElementById('publishBtn').onclick = async () => {
            const title = document.getElementById('postTitle').value.trim();
            const imageUrl = document.getElementById('postImg').value.trim();
            const content = document.getElementById('postContent').value.trim();

            if (!title || !content) return alert("Please enter both a title and content.");

            await push(ref(db, 'posts'), {
                title,
                imageUrl,
                content,
                views: 0,
                likesCount: 0,
                timestamp: serverTimestamp()
            });

            document.getElementById('postTitle').value = "";
            document.getElementById('postImg').value = "";
            document.getElementById('postContent').value = "";
            alert("Article published successfully!");
        };

        // Realtime Analytics Listener
        onValue(ref(db, 'posts'), (snapshot) => {
            const list = document.getElementById('adminPostsList');
            list.innerHTML = "";
            const data = snapshot.val();

            if (data && Object.keys(data).length > 0) {
                Object.keys(data).reverse().forEach(key => {
                    const post = data[key];
                    const views = post.views || 0;
                    const likes = post.likesCount || 0;

                    const item = document.createElement('div');
                    item.className = "bg-slate-900/60 border border-slate-700/60 p-4 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4";

                    item.innerHTML = `
                        <div class="flex-1">
                            <h3 class="font-bold text-base text-slate-100">${post.title || 'Untitled Article'}</h3>
                            <div class="flex items-center gap-6 mt-2 text-xs text-slate-400">
                                <span class="bg-sky-500/10 text-sky-400 px-3 py-1 rounded-full border border-sky-500/20">
                                    <i class="fa-solid fa-eye mr-1"></i> ${views} Views
                                </span>
                                <span class="bg-red-500/10 text-red-400 px-3 py-1 rounded-full border border-red-500/20">
                                    <i class="fa-solid fa-heart mr-1"></i> ${likes} Likes
                                </span>
                            </div>
                        </div>
                        <button onclick="deletePost('${key}')" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-4 py-2 rounded-xl text-xs font-bold border border-red-500/30 transition">
                            <i class="fa-solid fa-trash mr-1"></i> Delete
                        </button>
                    `;
                    list.appendChild(item);
                });
            } else {
                list.innerHTML = `<p class="text-xs text-slate-500 italic">No published articles available.</p>`;
            }
        });

        window.deletePost = (id) => {
            if (confirm("Are you sure you want to delete this post?")) {
                remove(ref(db, `posts/${id}`));
            }
        };
    </script>
</body>
</html>

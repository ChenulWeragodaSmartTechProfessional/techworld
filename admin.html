<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexyora Labs | Admin Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .ql-toolbar { background: #1e293b; border-color: #334155 !important; border-radius: 0.5rem 0.5rem 0 0; }
        .ql-container { background: #0f172a; border-color: #334155 !important; color: #f8fafc; border-radius: 0 0 0.5rem 0.5rem; min-height: 200px; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-4xl mx-auto glass p-8 rounded-3xl shadow-2xl">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-blue-400">Admin Post Manager</h1>
            <a href="/index.html" class="text-sm text-slate-400 hover:text-white">← Back to Site</a>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-2">Post Title</label>
                <input type="text" id="postTitle" placeholder="Enter title..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">Post Content & Formatting</label>
                <div id="editor"></div>
            </div>

            <button id="publishBtn" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold transition">Publish Post</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDM4BWnLf6jGycrMdQClWtq-Ra2iDidWsQ",
            authDomain: "tech-world-93ee6.firebaseapp.com",
            databaseURL: "https://tech-world-93ee6-default-rtdb.firebaseio.com",
            projectId: "tech-world-93ee6",
            storageBucket: "tech-world-93ee6.firebasestorage.app",
            appId: "1:912275465700:web:5ec12525e03446712153f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Initialize Quill Rich Text Editor with Color controls
        const quill = new Quill('#editor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline'],
                    [{ 'color': [] }, { 'background': [] }], // Color Picker
                    [{ 'align': [] }],
                    ['link', 'clean']
                ]
            }
        });

        // 🔒 OPTIONAL: Restrict admin access to specific email
        const ADMIN_EMAIL = "your-email@gmail.com"; 

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                alert("Please sign in first!");
                window.location.href = "/index.html";
            } else if (ADMIN_EMAIL !== "your-email@gmail.com" && user.email !== ADMIN_EMAIL) {
                alert("Unauthorized! Only the administrator can access this page.");
                window.location.href = "/index.html";
            }
        });

        // Publish Post to Firebase
        document.getElementById('publishBtn').onclick = async () => {
            const title = document.getElementById('postTitle').value.trim();
            const contentHtml = quill.root.innerHTML; // Get formatted HTML with colors

            if (!title || quill.getText().trim().length === 0) {
                return alert("Please add both a title and content.");
            }

            try {
                await push(ref(db, 'posts'), {
                    title: title,
                    content: contentHtml,
                    timestamp: serverTimestamp(),
                    author: auth.currentUser.email
                });

                alert("Post published successfully!");
                document.getElementById('postTitle').value = "";
                quill.setText("");
            } catch (err) {
                alert("Error publishing post: " + err.message);
            }
        };
    </script>
</body>
</html>

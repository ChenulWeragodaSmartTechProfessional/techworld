<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexyora Labs | Secure Admin Portal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hidden-panel { display: none !important; }
        
        .ql-toolbar { background: #1e293b; border-color: #334155 !important; border-radius: 0.75rem 0.75rem 0 0; }
        .ql-container { background: #0f172a; border-color: #334155 !important; color: #f8fafc; border-radius: 0 0 0.75rem 0.75rem; min-height: 220px; font-size: 1rem; }
        .ql-stroke { stroke: #cbd5e1 !important; }
        .ql-fill { fill: #cbd5e1 !important; }
        .ql-picker { color: #cbd5e1 !important; }
    </style>
</head>
<body class="p-4 md:p-8">

    <section id="adminLoginSection" class="max-w-md mx-auto mt-20">
        <div class="glass p-8 rounded-3xl shadow-2xl text-center">
            <div class="w-16 h-16 bg-blue-600/20 text-blue-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2">Admin Portal Login</h2>
            <p class="text-xs text-slate-400 mb-6">Sign in with your authorized Gmail account.</p>
            
            <div class="space-y-4">
                <button id="googleLoginBtn" class="w-full bg-white text-slate-900 hover:bg-slate-100 py-3 rounded-xl font-bold transition flex items-center justify-center gap-2 shadow-lg">
                    <i class="fa-brands fa-google text-red-500"></i> Continue with Google
                </button>

                <div class="flex items-center my-4">
                    <div class="flex-1 border-t border-slate-700"></div>
                    <span class="px-3 text-slate-500 text-xs uppercase">Or Email Sign In</span>
                    <div class="flex-1 border-t border-slate-700"></div>
                </div>

                <input type="email" id="adminEmail" placeholder="Admin Email" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
                <input type="password" id="adminPass" placeholder="Password" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
                <button id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold transition shadow-lg">Authenticate with Password</button>
            </div>
            
            <a href="/index.html" class="inline-block mt-6 text-xs text-slate-400 hover:text-white transition">← Return to Main Site</a>
        </div>
    </section>

    <main id="adminDashboard" class="max-w-4xl mx-auto glass p-6 md:p-10 rounded-3xl shadow-2xl hidden-panel">
        <div class="flex justify-between items-center mb-8 pb-4 border-b border-white/10">
            <div>
                <h1 class="text-2xl font-bold text-blue-400">Content Manager</h1>
                <p class="text-xs text-slate-400">Authenticated as: <span id="adminEmailDisplay" class="text-blue-300 font-bold"></span></p>
            </div>
            <div class="flex items-center gap-3">
                <a href="/index.html" class="text-xs bg-slate-800 border border-white/10 px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-700 transition">View Site</a>
                <button id="logoutBtn" class="text-xs bg-red-600/20 text-red-400 border border-red-500/20 px-3 py-2 rounded-lg font-bold hover:bg-red-600 hover:text-white transition">Logout</button>
            </div>
        </div>

        <div class="space-y-5 mb-10">
            <div class="flex justify-between items-center">
                <h2 id="formHeader" class="text-lg font-bold text-slate-200">Create New Article</h2>
                <button id="cancelEditBtn" class="hidden text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-1.5 rounded-lg transition">Cancel Edit</button>
            </div>

            <div>
                <label class="block text-xs font-semibold mb-1 text-slate-400">Post Title</label>
                <input type="text" id="postTitle" placeholder="Enter post title..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 font-semibold">
            </div>

            <div>
                <label class="block text-xs font-semibold mb-1 text-slate-400">Image URL (Optional)</label>
                <input type="text" id="postImage" placeholder="https://..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs font-semibold mb-1 text-slate-400">Content</label>
                <div id="editor"></div>
            </div>

            <button id="publishBtn" class="w-full bg-blue-600 hover:bg-blue-500 py-3.5 rounded-xl font-bold text-white shadow-xl transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> <span id="publishBtnText">Publish Live Post</span>
            </button>
        </div>

        <div class="border-t border-white/10 pt-6">
            <h2 class="text-lg font-bold text-slate-200 mb-4">Published Articles & Management</h2>
            <div id="managePostsList" class="space-y-3">
                <p class="text-xs text-slate-400 italic">Loading existing articles...</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, push, update, remove, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDM4BWnLf6jGycrMdQClWtq-Ra2iDidWsQ",
            authDomain: "tech-world-93ee6.firebaseapp.com",
            databaseURL: "https://tech-world-93ee6-default-rtdb.firebaseio.com",
            projectId: "tech-world-93ee6",
            storageBucket: "tech-world-93ee6.firebasestorage.app",
            appId: "1:912275465700:web:5ec12525e03446712153f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const googleProvider = new GoogleAuthProvider();

        const ADMIN_EMAIL = "ideas.by.chen@gmail.com"; 
        let editingPostId = null;
        let postsDataCache = {};

        const quill = new Quill('#editor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'color': [] }, { 'background': [] }],
                    [{ 'align': [] }],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['link', 'clean']
                ]
            }
        });

        // Authentication state handling
        onAuthStateChanged(auth, (user) => {
            if (user && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                document.getElementById('adminLoginSection').classList.add('hidden-panel');
                document.getElementById('adminDashboard').classList.remove('hidden-panel');
                document.getElementById('adminEmailDisplay').textContent = user.email;
                loadManagePosts();
            } else if (user) {
                alert("Unauthorized Access: " + user.email + " is not an admin.");
                signOut(auth);
            } else {
                document.getElementById('adminLoginSection').classList.remove('hidden-panel');
                document.getElementById('adminDashboard').classList.add('hidden-panel');
            }
        });

        document.getElementById('googleLoginBtn').onclick = async () => {
            try {
                const result = await signInWithPopup(auth, googleProvider);
                if (result.user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
                    alert("Access Denied.");
                    await signOut(auth);
                }
            } catch (err) { alert(err.message); }
        };

        document.getElementById('loginBtn').onclick = async () => {
            const email = document.getElementById('adminEmail').value.trim();
            const pass = document.getElementById('adminPass').value.trim();
            if (!email || !pass) return alert("Fill in required credentials.");
            try { await signInWithEmailAndPassword(auth, email, pass); } catch (err) { alert(err.message); }
        };

        document.getElementById('logoutBtn').onclick = () => signOut(auth);

        // Fetch post list and render options (Edit, Delete, Views, Likes)
        function loadManagePosts() {
            onValue(ref(db, 'posts'), (snapshot) => {
                const listContainer = document.getElementById('managePostsList');
                if (!snapshot.exists()) {
                    listContainer.innerHTML = `<p class="text-xs text-slate-500">No posts found.</p>`;
                    return;
                }

                postsDataCache = snapshot.val();
                listContainer.innerHTML = '';

                Object.keys(postsDataCache).reverse().forEach((id) => {
                    const post = postsDataCache[id];
                    const views = post.views || 0;
                    const likes = post.likes || 0;

                    const card = document.createElement('div');
                    card.className = "flex items-center justify-between p-3.5 bg-slate-900/80 border border-slate-700/60 rounded-xl gap-4";
                    card.innerHTML = `
                        <div class="overflow-hidden flex-1">
                            <h3 class="font-bold text-sm text-slate-200 truncate">${post.title || 'Untitled'}</h3>
                            <div class="flex items-center gap-3 mt-1 text-xs font-semibold">
                                <span class="text-blue-400 inline-flex items-center gap-1">
                                    <i class="fa-solid fa-eye"></i> ${views} ${views === 1 ? 'view' : 'views'}
                                </span>
                                <span class="text-rose-400 inline-flex items-center gap-1">
                                    <i class="fa-solid fa-heart"></i> ${likes} ${likes === 1 ? 'like' : 'likes'}
                                </span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="window.startEditing('${id}')" class="text-xs bg-blue-600/20 hover:bg-blue-600 text-blue-300 hover:text-white border border-blue-500/30 px-3 py-1.5 rounded-lg font-bold transition flex items-center gap-1">
                                <i class="fa-solid fa-pen-to-square"></i> Edit
                            </button>
                            <button onclick="window.deletePost('${id}')" class="text-xs bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white border border-red-500/30 px-3 py-1.5 rounded-lg font-bold transition flex items-center gap-1">
                                <i class="fa-solid fa-trash-can"></i> Delete
                            </button>
                        </div>
                    `;
                    listContainer.appendChild(card);
                });
            });
        }

        // Global function to start editing
        window.startEditing = (id) => {
            const post = postsDataCache[id];
            if (!post) return;

            editingPostId = id;
            document.getElementById('postTitle').value = post.title || '';
            document.getElementById('postImage').value = post.imageUrl || '';
            quill.root.innerHTML = post.content || '';

            document.getElementById('formHeader').textContent = "Editing Post";
            document.getElementById('publishBtnText').textContent = "Update Published Post";
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // Global function to delete a post
        window.deletePost = async (id) => {
            const post = postsDataCache[id];
            const title = post ? post.title : 'this article';

            if (confirm(`Are you sure you want to permanently delete "${title}"?`)) {
                try {
                    await remove(ref(db, 'posts/' + id));
                    alert("🗑️ Post deleted successfully!");
                    if (editingPostId === id) {
                        resetForm();
                    }
                } catch (err) {
                    alert("Error deleting post: " + err.message);
                }
            }
        };

        document.getElementById('cancelEditBtn').onclick = resetForm;

        function resetForm() {
            editingPostId = null;
            document.getElementById('postTitle').value = '';
            document.getElementById('postImage').value = '';
            quill.setText('');
            document.getElementById('formHeader').textContent = "Create New Article";
            document.getElementById('publishBtnText').textContent = "Publish Live Post";
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        // Save or Update post handler
        document.getElementById('publishBtn').onclick = async () => {
            const title = document.getElementById('postTitle').value.trim();
            const imageUrl = document.getElementById('postImage').value.trim();
            const contentHtml = quill.root.innerHTML;

            if (!title || quill.getText().trim().length === 0) {
                return alert("Title and content cannot be empty.");
            }

            try {
                if (editingPostId) {
                    await update(ref(db, 'posts/' + editingPostId), {
                        title: title,
                        imageUrl: imageUrl,
                        content: contentHtml,
                        lastUpdated: serverTimestamp()
                    });
                    alert("✅ Post updated successfully!");
                } else {
                    await push(ref(db, 'posts'), {
                        title: title,
                        imageUrl: imageUrl,
                        content: contentHtml,
                        author: auth.currentUser.email,
                        views: 0,
                        likes: 0,
                        timestamp: serverTimestamp()
                    });
                    alert("🎉 Post published live!");
                }
                resetForm();
            } catch (err) {
                alert("Error: " + err.message);
            }
        };
    </script>
</body>
</html>

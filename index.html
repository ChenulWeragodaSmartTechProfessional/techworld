    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendEmailVerification, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue, push, get, set, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDM4BWnLf6jGycrMdQClWtq-Ra2iDidWsQ",
            authDomain: "tech-world-93ee6.firebaseapp.com",
            databaseURL: "https://tech-world-93ee6-default-rtdb.firebaseio.com",
            projectId: "tech-world-93ee6",
            storageBucket: "tech-world-93ee6.firebasestorage.app",
            appId: "1:912275465700:web:5ec12525e03446712153f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const googleProvider = new GoogleAuthProvider();

        document.getElementById('googleBtn').onclick = async () => {
            try { await signInWithPopup(auth, googleProvider); } catch (err) { alert("Tech World: " + err.message); }
        };

        document.getElementById('authBtn').onclick = async () => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value.trim();
            if(!email || !pass) return alert("Tech World: Enter credentials.");

            try {
                const res = await signInWithEmailAndPassword(auth, email, pass);
                if (!res.user.emailVerified) {
                    alert("Tech World: Please verify your email first!");
                    await signOut(auth);
                }
            } catch (error) {
                if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                    try {
                        const newUser = await createUserWithEmailAndPassword(auth, email, pass);
                        await sendEmailVerification(newUser.user);
                        alert("Tech World says: Verification email sent! Please check your inbox and verify your account.");
                        await signOut(auth);
                    } catch (regErr) { alert("Tech World: " + regErr.message); }
                } else { alert("Tech World: " + error.message); }
            }
        };

        window.signOutUser = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            const isVerified = user && user.emailVerified;
            document.getElementById('authSection').classList.toggle('auth-hidden', isVerified);
            document.getElementById('mainContent').classList.toggle('auth-hidden', !isVerified);
            document.getElementById('userHeader').classList.toggle('auth-hidden', !isVerified);
            if (isVerified) { setupRealtimeListeners(user); handleDailyReward(user); }
        });

        function setupRealtimeListeners(user) {
            onValue(ref(db, 'users/' + user.uid), (snap) => {
                const d = snap.val();
                if (d) document.getElementById('displayPoints').textContent = (d.points || 0) + " PTS";
            });

            onValue(ref(db, 'comments'), (snap) => {
                const list = document.getElementById('commentList');
                list.innerHTML = ""; // Clear list
                const d = snap.val();
                if (d) {
                    Object.keys(d).reverse().forEach(k => {
                        const c = d[k];
                        
                        // SECURE DISPLAY: Use textContent to prevent XSS
                        const div = document.createElement('div');
                        div.className = "bg-slate-900/40 p-4 rounded-2xl border border-white/5";
                        
                        const userP = document.createElement('p');
                        userP.className = "text-blue-400 font-bold text-xs";
                        userP.textContent = c.user;
                        
                        const textP = document.createElement('p');
                        textP.className = "text-slate-300 text-sm mt-1";
                        textP.textContent = c.text;
                        
                        div.appendChild(userP);
                        div.appendChild(textP);
                        list.appendChild(div);
                    });
                }
            });
        }

        async function handleDailyReward(user) {
            const today = new Date().toISOString().split('T')[0];
            const userRef = ref(db, 'users/' + user.uid);
            const snap = await get(userRef);
            if (snap.exists()) {
                const d = snap.val();
                if (d.lastLogin !== today) {
                    await update(userRef, { points: (d.points || 0) + 5, lastLogin: today });
                    document.getElementById('rewardMsg').classList.remove('hidden');
                }
            } else { await set(userRef, { points: 5, lastLogin: today, email: user.email }); }
        }

        document.getElementById('postComment').onclick = async () => {
            const input = document.getElementById('commentMsg');
            if (input.value.trim() && auth.currentUser) {
                push(ref(db, 'comments'), { user: auth.currentUser.email.split('@')[0], text: input.value, timestamp: serverTimestamp() });
                input.value = "";
            }
        };
    </script>

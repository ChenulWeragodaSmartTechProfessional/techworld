<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Mode</title>
    <style>
        /* This ID is specific to override injected styles */
        #recovery-shield {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            background-color: #111 !important;
            color: #fff !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: center !important;
            z-index: 999999 !important; /* Stays on top of everything */
            font-family: sans-serif !important;
            text-align: center !important;
        }

        .notice-box {
            max-width: 600px;
            padding: 40px;
            border-top: 5px solid #ff0000;
            background: #1a1a1a;
        }

        h1 { color: #fff; margin-bottom: 10px; }
        p { color: #ccc; line-height: 1.6; }

        .dev-note {
            margin-top: 50px;
            font-family: monospace;
            color: #555;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div id="recovery-shield">
        <div class="notice-box">
            <h1>We'll Be Right Back</h1>
            <p>To our valued visitors: Don't worry! We are performing some security updates and temporary maintenance. Your data is safe, and we will be back online shortly.</p>
        </div>

        <div class="dev-note">
            [ STATUS: DEFENSE ACTIVE ] <br>
            To the person injecting CSS: Nice try, but we aren't stopping. <br>
            We're just getting started.
        </div>
    </div>

</body>
</html>

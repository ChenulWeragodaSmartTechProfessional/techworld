    <main id="mainContent" class="max-w-3xl mx-auto px-4 pb-20 mt-8 relative z-10 auth-hidden">

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, set, update, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDM4BWnLf6jGycrMdQClWtq-Ra2iDidWsQ",
            authDomain: "tech-world-93ee6.firebaseapp.com",
            databaseURL: "https://tech-world-93ee6-default-rtdb.firebaseio.com",
            projectId: "tech-world-93ee6",
            storageBucket: "tech-world-93ee6.firebasestorage.app",
            appId: "1:912275465700:web:5ec12525e03446712153f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        // Auth Logic
        document.getElementById('authBtn').onclick = async () => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            if(!email || !pass) return alert("Fill all fields");
            
            try { 
                await signInWithEmailAndPassword(auth, email, pass); 
            } catch (e) {
                try {
                    const res = await createUserWithEmailAndPassword(auth, email, pass);
                    await sendEmailVerification(res.user);
                    alert("Verification email sent! Check your inbox.");
                    await signOut(auth);
                } catch (err) { alert(err.message); }
            }
        };

        document.getElementById('googleBtn').onclick = async () => { try { await signInWithPopup(auth, provider); } catch (e) { alert(e.message); } };
        window.signOutUser = () => signOut(auth);

        // State Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (user.emailVerified || user.providerData[0].providerId === "google.com") {
                    document.getElementById('authSection').classList.add('auth-hidden');
                    document.getElementById('mainContent').classList.remove('auth-hidden');
                    document.getElementById('userHeader').classList.remove('auth-hidden');
                    handlePoints(user);
                    loadComments();
                } else {
                    alert("Please verify your email!");
                    signOut(auth);
                }
            } else {
                document.getElementById('authSection').classList.remove('auth-hidden');
                document.getElementById('mainContent').classList.add('auth-hidden');
                document.getElementById('userHeader').classList.add('auth-hidden');
            }
        });

     // Points Logic
        async function handlePoints(user) {
            const userRef = ref(db, 'users/' + user.uid);
            const today = new Date().toISOString().split('T')[0];
            const displayElement = document.getElementById('displayPoints');
            const rewardMsg = document.getElementById('rewardMsg');

            try {
                const snap = await get(userRef);

                if (snap.exists()) {
                    const data = snap.val();
                    const currentPoints = Number(data.points) || 0;

                    // Update UI with existing points immediately
                    displayElement.textContent = currentPoints + " PTS";

                    // Check if user has already claimed today's points
                    if (data.lastLogin !== today) {
                        const newTotal = currentPoints + 5;

                        await update(userRef, {
                            points: newTotal,
                            lastLogin: today,
                            email: user.email
                        });

                        // Update UI for the reward
                        displayElement.textContent = newTotal + " PTS";
                        rewardMsg.classList.remove('hidden');
                    }
                } else {
                    // New User Logic: Create their initial record and give first points
                    const initialPoints = 5;
                    await set(userRef, {
                        points: initialPoints,
                        lastLogin: today,
                        email: user.email,
                        createdAt: serverTimestamp()
                    });

                    displayElement.textContent = initialPoints + " PTS";
                    rewardMsg.classList.remove('hidden');
                }
            } catch (err) {
                console.error("Point Update Failed:", err.message);
            }
        }

        // Comments Logic
        document.getElementById('postComment').onclick = () => {
            const input = document.getElementById('commentMsg');
            const text = input.value.trim();
            if (text && auth.currentUser) {
                push(ref(db, 'comments'), {
                    user: auth.currentUser.displayName || auth.currentUser.email.split('@')[0],
                    text: text,
                    timestamp: serverTimestamp()
                });
                input.value = "";
            }
        };

        function loadComments() {
            onValue(ref(db, 'comments'), (snap) => {
                const list = document.getElementById('commentList');
                list.innerHTML = "";
                const data = snap.val();
                if (data) {
                    Object.values(data).reverse().forEach(c => {
                        const div = document.createElement('div');
                        div.className = "bg-slate-900/40 p-4 rounded-2xl border border-white/5";
                        div.innerHTML = `<span class="text-blue-400 font-bold text-xs">${c.user}</span><p class="text-slate-300 text-sm mt-1">${c.text}</p>`;
                        list.appendChild(div);
                    });
                }
            });
        }

        // UI Effects
        particlesJS("particles-js", { "particles": { "number": { "value": 40 }, "color": { "value": "#3b82f6" }, "move": { "enable": true, "speed": 1 }, "line_linked": { "opacity": 0.2 } } });
            // New User Logic: Create their initial record and give first points
            const initialPoints = 5;
            await set(userRef, {
                points: initialPoints,
                lastLogin: today,
                email: user.email,
                createdAt: serverTimestamp() // Useful for tracking user age
            });

            displayElement.textContent = initialPoints + " PTS";
            rewardMsg.classList.remove('hidden');
        }
    } catch (error) {
        console.error("Error handling points:", error);
    }

                        email: user.email 
                    });
                    document.getElementById('displayPoints').textContent = "5 PTS";
                    document.getElementById('rewardMsg').classList.remove('hidden');
                }
            } catch (err) {
                console.error("Point Update Failed:", err.message);
            }
        }

        // Comments Logic
        document.getElementById('postComment').onclick = () => {
            const input = document.getElementById('commentMsg');
            const text = input.value.trim();
            if(text && auth.currentUser) {
                push(ref(db, 'comments'), {
                    user: auth.currentUser.displayName || auth.currentUser.email.split('@')[0],
                    text: text,
                    timestamp: serverTimestamp()
                });
                input.value = "";
            }
        };

        function loadComments() {
            onValue(ref(db, 'comments'), (snap) => {
                const list = document.getElementById('commentList'); 
                list.innerHTML = "";
                const data = snap.val();
                if(data) {
                    Object.values(data).reverse().forEach(c => {
                        const div = document.createElement('div');
                        div.className = "bg-slate-900/40 p-4 rounded-2xl border border-white/5";
                        div.innerHTML = `<span class="text-blue-400 font-bold text-xs">${c.user}</span><p class="text-slate-300 text-sm mt-1">${c.text}</p>`;
                        list.appendChild(div);
                    });
                }
            });
        }

        // UI Effects
        particlesJS("particles-js", { "particles": { "number": { "value": 40 }, "color": { "value": "#3b82f6" }, "move": { "enable": true, "speed": 1 }, "line_linked": { "opacity": 0.2 } } });
    </script>

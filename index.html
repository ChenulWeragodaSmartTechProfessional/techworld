<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: 'unsafe-inline' wss://*.firebaseio.com https://*.googleapis.com https://*.gstatic.com; script-src 'self' https: 'unsafe-inline' 'unsafe-eval';">
    <title>Tech World | Stay Ahead</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body { background-color: #0f172a; color: #f8fafc; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .auth-hidden { display: none !important; }
        .gradient-text { background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>

<body class="font-sans">
    <nav class="p-6 flex justify-between items-center max-w-6xl mx-auto relative z-10">
        <h1 class="text-2xl font-bold uppercase gradient-text">Tech World</h1>
        
        <div id="userHeader" class="auth-hidden flex items-center gap-4">
            <a href="profile.html" class="flex items-center gap-2 bg-slate-800/50 border border-white/10 px-4 py-1.5 rounded-full hover:bg-slate-700 transition">
                <i class="fa-solid fa-user-circle text-blue-400"></i>
                <span id="displayPoints" class="text-yellow-500 font-bold text-sm">0 PTS</span>
            </a>
            <button onclick="signOutUser()" class="text-red-400 text-xs font-bold uppercase">Logout</button>
        </div>
    </nav>

    <section id="authSection" class="max-w-md mx-auto mt-16 px-4">
        <div class="glass p-8 rounded-3xl shadow-2xl text-center">
            <h2 class="text-3xl font-bold mb-6">Member Portal</h2>
            <div class="space-y-3">
                <input type="email" id="email" placeholder="Email" class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
                <input type="password" id="password" placeholder="Password" class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
                <button id="authBtn" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold transition">Sign In</button>
            </div>
        </div>
    </section>

    <main id="mainContent" class="max-w-3xl mx-auto px-4 pb-20 mt-8 auth-hidden">
        <div id="rewardMsg" class="hidden bg-blue-600 p-4 rounded-2xl text-center font-bold mb-8">
            🎉 +5 Points added for your daily visit!
        </div>

        <article class="glass rounded-3xl overflow-hidden shadow-2xl mb-8">
            <div class="p-6 md:p-8">
                <div class="aspect-video mb-6">
                    <iframe class="w-full h-full rounded-xl" src="https://www.youtube.com/embed/mL3vmY3aqL4" frameborder="0" allowfullscreen></iframe>
                </div>
                
                <section class="mt-12 pt-8 border-t border-slate-800">
                    <h4 class="text-xs font-bold text-slate-500 uppercase mb-6">Community Chat</h4>
                    <div id="commentList" class="space-y-4 mb-8 max-h-96 overflow-y-auto pr-2">
                        </div>
                    <div class="flex gap-2">
                        <input type="text" id="commentMsg" placeholder="Say something..." class="flex-1 bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:border-blue-500">
                        <button id="postComment" class="bg-blue-600 px-6 py-3 rounded-xl font-bold text-sm">Post</button>
                    </div>
                </section>
            </div>
        </article>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue, push, get, set, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDM4BWnLf6jGycrMdQClWtq-Ra2iDidWsQ",
            authDomain: "tech-world-93ee6.firebaseapp.com",
            databaseURL: "https://tech-world-93ee6-default-rtdb.firebaseio.com",
            projectId: "tech-world-93ee6",
            storageBucket: "tech-world-93ee6.firebasestorage.app",
            appId: "1:912275465700:web:5ec12525e03446712153f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Auth Click Handlers
        document.getElementById('authBtn').onclick = () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, pass).catch(err => alert(err.message));
        };
        window.signOutUser = () => signOut(auth);

        // State Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('authSection').classList.add('auth-hidden');
                document.getElementById('mainContent').classList.remove('auth-hidden');
                document.getElementById('userHeader').classList.remove('auth-hidden');
                
                // Start Real-time Listeners
                setupRealtimeListeners(user);
                handleDailyReward(user);
            } else {
                document.getElementById('authSection').classList.remove('auth-hidden');
                document.getElementById('mainContent').classList.add('auth-hidden');
                document.getElementById('userHeader').classList.add('auth-hidden');
            }
        });

        function setupRealtimeListeners(user) {
            // 1. Sync Points Real-time
            onValue(ref(db, 'users/' + user.uid), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    document.getElementById('displayPoints').textContent = (data.points || 0) + " PTS";
                }
            });

            // 2. Sync Comments Real-time
            onValue(ref(db, 'comments'), (snapshot) => {
                const list = document.getElementById('commentList');
                list.innerHTML = "";
                const data = snapshot.val();
                if (data) {
                    Object.keys(data).reverse().forEach(key => {
                        const c = data[key];
                        const div = document.createElement('div');
                        div.className = "bg-slate-900/40 p-4 rounded-2xl border border-white/5";
                        div.innerHTML = `<p class="text-blue-400 font-bold text-xs">${c.user}</p>
                                         <p class="text-slate-300 text-sm mt-1">${c.text}</p>`;
                        list.appendChild(div);
                    });
                }
            });
        }

        async function handleDailyReward(user) {
            const today = new Date().toISOString().split('T')[0];
            const userRef = ref(db, 'users/' + user.uid);
            const snap = await get(userRef);
            
            if (snap.exists()) {
                const data = snap.val();
                if (data.lastLogin !== today) {
                    await update(userRef, { points: (data.points || 0) + 5, lastLogin: today });
                    document.getElementById('rewardMsg').classList.remove('hidden');
                }
            } else {
                await set(userRef, { points: 5, lastLogin: today, email: user.email });
            }
        }

        document.getElementById('postComment').onclick = async () => {
            const input = document.getElementById('commentMsg');
            const text = input.value.trim();
            if (text && auth.currentUser) {
                // Get the user's latest display name from DB
                const userSnap = await get(ref(db, 'users/' + auth.currentUser.uid));
                const name = userSnap.exists() ? (userSnap.val().displayName || auth.currentUser.email.split('@')[0]) : auth.currentUser.email.split('@')[0];
                
                push(ref(db, 'comments'), {
                    user: name,
                    text: text,
                    timestamp: serverTimestamp()
                });
                input.value = "";
            }
        };
    </script>
</body>
</html>
